[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-tl"
version = "2.0.1"
description = "Aetherius TL — Telethon fork for Aetheris userbot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Elisartix" }
]
keywords = ["telegram", "api", "mtproto", "client", "library", "messaging", "aetherius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "pyaes",
    "rsa",
]

[project.optional-dependencies]
cryptg = ["cryptg"]

[project.urls]
Homepage = "https://github.com/elisartix/aetheris-tl"
Source = "https://github.com/elisartix/aetheris-tl"

[tool.setuptools.packages.find]
include = ["aetheris_tl*"]
